version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/expenses.db:/app/expenses.db
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Change this if deploying to a remote host (e.g. https://api.yourdomain.com)
        - VITE_API_URL=http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always
